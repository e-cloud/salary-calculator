<!-- 基础表单组件 -->
<app-calculator-form
  [usePredefinedInsurancePercents]="usePredefinedInsurancePercents()"
  [cityRecipe]="cityRecipe()"
  [recipeIndex$]="recipeIndex$"
  (calculate)="calculate($event)"
  (clearResult)="clearResult()"
  (changeRecipe)="changeRecipe($event)"
  (selectRecipeItem)="selectRecipeItem($event)"
  (changePredefineCondition)="changePredefineCondition($event)"
  (changeSelectedYear)="selectedYear = $event"
></app-calculator-form>

<div class="row mt-4">
  <app-monthly-results
    class="col-lg-6 col-sm-12 mb-4 mb-md-0"
    [clear]="clear()"
    [monthlyIncomes$]="monthlyIncomes$"
    [monthlyMetas$]="monthlyMetas$"
    [cityRecipe]="cityRecipe()"
    [scroll$]="scroll$"
    [calculationYear]="selectedYear"
    (updateMeta)="updateMeta($event.meta, $event.index)"
    (changeChartMonth)="changeChartMonth($event)"
  ></app-monthly-results>

  <div class="col-lg-6">
    <app-summary-charts
      [clear]="clear()"
      [monthlyIncomes$]="monthlyIncomes$"
      [summary$]="summary$"
      [selectedMonth$]="selectedMonth$"
      [scroll$]="scroll$"
      (changeChartMonth)="changeChartMonth($event)"
    ></app-summary-charts>

    <app-summary-details
      [clear]="clear()"
      [summary$]="summary$"
      [monthlyIncomes]="(monthlyIncomes$ | async) || []"
      [cityLabel]="cityRecipe()?.city || '全国'"
      [year]="selectedYear"
    ></app-summary-details>

    @if (!clear() && (summary$ | async); as sum) {
      <app-bonus-optimization-card
        [trapResult]="sum.bonusTaxTrap"
        [annualBonus]="sum.bonus"
      ></app-bonus-optimization-card>
    }

    <app-tax-bracket-timeline
      [clear]="clear()"
      [monthlyIncomes]="(monthlyIncomes$ | async) || []"
      [selectedMonth]="(selectedMonth$ | async) || 1"
      (changeSelectedMonth)="changeChartMonth($event)"
    ></app-tax-bracket-timeline>
  </div>
</div>
