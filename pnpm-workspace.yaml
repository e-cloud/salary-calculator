packages:
  # all packages in subdirs of packages/ and components/
  - 'packages/**'
  - 'apps/**'
  # exclude packages that are inside test directories
  - '!**/test/**'
  - '!**/example/**'

onlyBuiltDependencies:
  - '@parcel/watcher'
  - esbuild
  - lmdb
  - msgpackr-extract

minimumReleaseAge: 0

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
